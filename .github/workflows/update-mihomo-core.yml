name: Update mihomo core from upstream

# 作用：
# - 定时 / 手动 从 MetaCubeX/mihomo 官方 Release 拉取最新 windows-amd64
# - 上传到「本仓库」的 GitHub Release（tag: core-vX.Y.Z）
# - 不把 mihomo.exe 直接塞进 Git 历史（体积大、难 diff）
#
# 说明：
# - 这跟「管理面板更新内核」是两回事：这里是 GitHub 自动跟官方上游
# - 需要仓库开启 Actions 写权限（Settings → Actions → General → Workflow permissions）

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 03:00 检查一次（约北京时间 11:00）
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest MetaCubeX/mihomo release
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'MetaCubeX';
            const repo = 'mihomo';
            const release = await github.rest.repos.getLatestRelease({ owner, repo });
            const tag = release.data.tag_name; // e.g. v1.19.x
            const assets = release.data.assets || [];
            // Prefer normal windows-amd64 zip, skip go120/compatible if possible
            let asset = assets.find(a =>
              /windows-amd64/i.test(a.name) &&
              /\.zip$/i.test(a.name) &&
              !/go120|compatible/i.test(a.name)
            );
            if (!asset) {
              asset = assets.find(a => /windows-amd64/i.test(a.name) && /\.zip$/i.test(a.name));
            }
            if (!asset) {
              core.setFailed('No windows-amd64 zip found in latest mihomo release');
              return;
            }
            core.setOutput('tag', tag);
            core.setOutput('asset_name', asset.name);
            core.setOutput('asset_url', asset.browser_download_url);
            core.info(`Upstream tag: ${tag}`);
            core.info(`Asset: ${asset.name}`);

      - name: Check if this repo already has core release
        id: local
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'core-${{ steps.upstream.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setOutput('exists', 'true');
              core.info(`Release ${tag} already exists, skip.`);
            } catch (e) {
              core.setOutput('exists', 'false');
              core.info(`Release ${tag} not found, will create.`);
            }

      - name: Download and prepare mihomo.exe
        if: steps.local.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail -o mihomo.zip "${{ steps.upstream.outputs.asset_url }}"
          unzip -o mihomo.zip -d extract
          EXE="$(find extract -type f -name 'mihomo*.exe' | head -n 1)"
          if [ -z "$EXE" ]; then
            echo "mihomo*.exe not found in zip"
            find extract -type f | head
            exit 1
          fi
          cp "$EXE" dist/mihomo.exe
          echo "Prepared: dist/mihomo.exe"
          ls -lh dist/mihomo.exe

      - name: Create GitHub Release with core binary
        if: steps.local.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-${{ steps.upstream.outputs.tag }}
          name: mihomo core ${{ steps.upstream.outputs.tag }}
          body: |
            自动同步自上游官方内核：

            - 上游仓库：https://github.com/MetaCubeX/mihomo
            - 上游版本：`${{ steps.upstream.outputs.tag }}`
            - 资源文件：`${{ steps.upstream.outputs.asset_name }}`
            - 本仓库附件：`mihomo.exe`（windows-amd64）

            管理面板「更新内核」也可直接从官方 Release 下载；
            本 Release 方便你在 GitHub 侧固定/分发同一版本。
          files: |
            dist/mihomo.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
